<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Annotation tools</title>
  <desc id="desc">Four animated panels: a bounding box, a polygon, an oriented box rotating into place, and a SAM smart-select mask.</desc>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1d2533" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .draw { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
    .cycle { animation: cycle 6s linear infinite; }
    .d1 { animation: d1 6s ease-in-out infinite; }
    .d2 { animation: d2 6s ease-in-out infinite; }
    .show1 { animation: show1 6s ease-out infinite; }
    .show2 { animation: show2 6s ease-out infinite; }
    .ripple { animation: ripple 6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes cycle { 0%, 86% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes d1 { 0%, 5% { stroke-dashoffset: 100; } 32%, 100% { stroke-dashoffset: 0; } }
    @keyframes d2 { 0%, 28% { stroke-dashoffset: 100; } 50%, 100% { stroke-dashoffset: 0; } }
    @keyframes show1 { 0%, 32% { opacity: 0; } 38%, 100% { opacity: 1; } }
    @keyframes show2 { 0%, 50% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes ripple { 0%, 4% { opacity: 0; transform: scale(.2); } 8% { opacity: 1; } 26%, 100% { opacity: 0; transform: scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ripple { opacity: 0; } }
  </style>

  <rect width="1200" height="260" rx="16" fill="#0d0f13"/>
  <rect x=".5" y=".5" width="1199" height="259" rx="16" fill="none" stroke="#232831"/>

  <g class="sans">
    <!-- Panel 1: bounding box -->
    <rect x="24" y="20" width="276" height="220" rx="14" fill="#13161c" stroke="#272c35"/>
    <rect x="40" y="36" width="244" height="150" rx="8" fill="#151c29"/>
    <rect x="40" y="36" width="244" height="150" rx="8" fill="url(#g)"/>
    <ellipse cx="162" cy="116" rx="52" ry="32" fill="#2c3d5c"/>
    <ellipse cx="148" cy="106" rx="18" ry="8" fill="#3d5480"/>
    <g class="cycle">
      <path class="draw d1" pathLength="100" stroke="#5fd0e8" d="M104 78 H220 V154 H104 Z"/>
      <g class="show1" fill="#0d0f13" stroke="#5fd0e8" stroke-width="1.5">
        <rect x="100" y="74" width="8" height="8"/><rect x="158" y="74" width="8" height="8"/><rect x="216" y="74" width="8" height="8"/>
        <rect x="100" y="112" width="8" height="8"/><rect x="216" y="112" width="8" height="8"/>
        <rect x="100" y="150" width="8" height="8"/><rect x="158" y="150" width="8" height="8"/><rect x="216" y="150" width="8" height="8"/>
      </g>
    </g>
    <text x="40" y="212" font-size="15" font-weight="700" fill="#e9ecf1">Bounding box</text>
    <rect x="148" y="198" width="22" height="20" rx="4" fill="#1c2740" stroke="#2c3e66"/>
    <text x="159" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#9fbfff">B</text>
    <text x="40" y="230" font-size="12" fill="#7a8290">Drag to frame an object</text>

    <!-- Panel 2: polygon -->
    <rect x="312" y="20" width="276" height="220" rx="14" fill="#13161c" stroke="#272c35"/>
    <rect x="328" y="36" width="244" height="150" rx="8" fill="#151c29"/>
    <rect x="328" y="36" width="244" height="150" rx="8" fill="url(#g)"/>
    <path d="M398 140 C392 100 430 70 472 72 C500 74 512 100 502 124 C490 150 440 160 398 140 Z" fill="#24503d"/>
    <g class="cycle">
      <path class="draw d1" pathLength="100" stroke="#37d67a" d="M392 146 L394 104 L424 72 L470 64 L508 90 L508 128 L470 156 L420 160 Z"/>
      <path class="show1" fill="#37d67a" fill-opacity=".14" d="M392 146 L394 104 L424 72 L470 64 L508 90 L508 128 L470 156 L420 160 Z"/>
      <g fill="#37d67a" stroke="#0d0f13" stroke-width="1.5">
        <circle cx="392" cy="146" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.05;.06;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="394" cy="104" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.085;.095;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="424" cy="72" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.12;.13;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="470" cy="64" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.155;.165;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="508" cy="90" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.19;.2;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="508" cy="128" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.225;.235;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="470" cy="156" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.26;.27;1" dur="6s" repeatCount="indefinite"/></circle>
        <circle cx="420" cy="160" r="4.5"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.295;.305;1" dur="6s" repeatCount="indefinite"/></circle>
      </g>
    </g>
    <text x="328" y="212" font-size="15" font-weight="700" fill="#e9ecf1">Polygon</text>
    <rect x="394" y="198" width="22" height="20" rx="4" fill="#1c2740" stroke="#2c3e66"/>
    <text x="405" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#9fbfff">P</text>
    <text x="328" y="230" font-size="12" fill="#7a8290">Click vertices · Enter to close</text>

    <!-- Panel 3: oriented box -->
    <rect x="600" y="20" width="276" height="220" rx="14" fill="#13161c" stroke="#272c35"/>
    <rect x="616" y="36" width="244" height="150" rx="8" fill="#151c29"/>
    <rect x="616" y="36" width="244" height="150" rx="8" fill="url(#g)"/>
    <g transform="rotate(-22 738 111)">
      <rect x="668" y="89" width="140" height="44" rx="6" fill="#4a3a26"/>
      <path d="M680 104 H796 M680 118 H796" stroke="#5c4a32" stroke-width="2"/>
      <g class="cycle">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="16 738 111;16 738 111;0 738 111;0 738 111" keyTimes="0;.34;.52;1" dur="6s" repeatCount="indefinite"/>
          <path class="draw d1" pathLength="100" stroke="#f5a524" d="M658 81 H818 V141 H658 Z"/>
          <g class="show1">
            <path d="M738 81 V64" stroke="#f5a524" stroke-width="2"/>
            <circle cx="738" cy="60" r="5" fill="#0d0f13" stroke="#f5a524" stroke-width="2"/>
          </g>
        </g>
      </g>
    </g>
    <text x="616" y="212" font-size="15" font-weight="700" fill="#e9ecf1">Oriented box</text>
    <rect x="718" y="198" width="38" height="20" rx="4" fill="#2e2412" stroke="#6a4f1c"/>
    <text x="737" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#f5c46a">OBB</text>
    <text x="616" y="230" font-size="12" fill="#7a8290">Rotate to fit angled objects</text>

    <!-- Panel 4: smart select -->
    <rect x="888" y="20" width="288" height="220" rx="14" fill="#13161c" stroke="#272c35"/>
    <rect x="904" y="36" width="256" height="150" rx="8" fill="#151c29"/>
    <rect x="904" y="36" width="256" height="150" rx="8" fill="url(#g)"/>
    <path d="M984 152 C964 122 980 84 1016 80 C1046 76 1082 92 1080 124 C1078 152 1046 162 1026 158 C1008 162 994 160 984 152 Z" fill="#3a2f4f"/>
    <g class="cycle">
      <circle class="ripple" cx="1030" cy="120" r="18" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path class="show2" fill="#a78bfa" fill-opacity=".38" d="M984 152 C964 122 980 84 1016 80 C1046 76 1082 92 1080 124 C1078 152 1046 162 1026 158 C1008 162 994 160 984 152 Z"/>
      <path class="draw d2" pathLength="100" stroke="#a78bfa" d="M984 152 C964 122 980 84 1016 80 C1046 76 1082 92 1080 124 C1078 152 1046 162 1026 158 C1008 162 994 160 984 152 Z"/>
      <circle cx="1030" cy="120" r="4.5" fill="#e9ecf1" stroke="#0d0f13" stroke-width="1.5"/>
      <g class="show2">
        <rect x="1090" y="60" width="62" height="18" rx="3" fill="#a78bfa"/>
        <text x="1121" y="73" text-anchor="middle" font-size="11" font-weight="700" fill="#0d0f13">SAM mask</text>
      </g>
    </g>
    <text x="904" y="212" font-size="15" font-weight="700" fill="#e9ecf1">Smart select</text>
    <rect x="1002" y="198" width="40" height="20" rx="4" fill="#241c3a" stroke="#4b3a7a"/>
    <text x="1022" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#c9b6ff">SAM</text>
    <text x="904" y="230" font-size="12" fill="#7a8290">Click or drag · returns a polygon</text>
  </g>
</svg>
