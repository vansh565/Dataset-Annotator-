<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Vertex — local image annotation workstation</title>
  <desc id="desc">Animated banner: an AI scan passes over an image, then a car box, a person box and a tree polygon are drawn and labelled.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#171b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".22" cy=".3" r=".7">
      <stop offset="0" stop-color="#4f8cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".33" stop-color="#5fd0e8"/>
      <stop offset=".66" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4f8cff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a2c"/>
      <stop offset="1" stop-color="#1c2a42"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0e8" stop-opacity="0"/>
      <stop offset="1" stop-color="#5fd0e8" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="canvasClip">
      <rect x="640" y="80" width="500" height="250" rx="8"/>
    </clipPath>
    <clipPath id="typeClip">
      <rect x="60" y="204" width="470" height="36">
        <animate attributeName="width" values="0;470;470;0" keyTimes="0;.3;.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
    .overlay { animation: overlay 9s linear infinite; }
    .scan { opacity: 0; animation: scan 9s ease-in-out infinite; }
    .dA { animation: dA 9s ease-in-out infinite; }
    .dB { animation: dB 9s ease-in-out infinite; }
    .dC { animation: dC 9s ease-in-out infinite; }
    .tA { animation: tA 9s ease-out infinite; }
    .tB { animation: tB 9s ease-out infinite; }
    .tC { animation: tC 9s ease-out infinite; }
    .done { animation: done 9s ease-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes overlay { 0%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes scan { 0% { opacity: 0; transform: translateY(0); } 2% { opacity: 1; } 15% { opacity: 1; transform: translateY(210px); } 17%, 100% { opacity: 0; transform: translateY(210px); } }
    @keyframes dA { 0%, 17% { stroke-dashoffset: 100; } 29%, 100% { stroke-dashoffset: 0; } }
    @keyframes dB { 0%, 31% { stroke-dashoffset: 100; } 43%, 100% { stroke-dashoffset: 0; } }
    @keyframes dC { 0%, 45% { stroke-dashoffset: 100; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes tA { 0%, 29% { opacity: 0; } 33%, 100% { opacity: 1; } }
    @keyframes tB { 0%, 43% { opacity: 0; } 47%, 100% { opacity: 1; } }
    @keyframes tC { 0%, 60% { opacity: 0; } 64%, 100% { opacity: 1; } }
    @keyframes done { 0%, 66% { opacity: 0; } 70%, 100% { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="#0d0f13"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="20" fill="none" stroke="#232831"/>

  <!-- Left: identity -->
  <g class="sans">
    <rect x="60" y="62" width="268" height="30" rx="15" fill="#1c2740" stroke="#2c3e66"/>
    <circle cx="80" cy="77" r="5" fill="#37d67a" class="pulse"/>
    <text x="94" y="82" font-size="13" font-weight="600" fill="#9fbfff" letter-spacing="1.6">LOCAL-FIRST ANNOTATION</text>

    <text x="56" y="178" font-size="96" font-weight="800" fill="url(#shine)" letter-spacing="-2">Vertex</text>
  </g>

  <g clip-path="url(#typeClip)">
    <text x="62" y="230" class="mono" font-size="22" fill="#e9ecf1">Local image annotation workstation</text>
  </g>
  <rect x="62" y="210" width="3" height="26" fill="#5fd0e8" class="blink">
    <animate attributeName="x" values="62;532;532;62" keyTimes="0;.3;.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <g class="sans">
    <text x="62" y="276" font-size="17" fill="#7a8290">Import  →  annotate  →  version  →  train  →  export</text>
    <text x="62" y="300" font-size="17" fill="#7a8290">Flask + SQLite on your machine. Your data never leaves it.</text>

    <g font-size="13" font-weight="700">
      <rect x="62"  y="326" width="58" height="26" rx="6" fill="#16203a" stroke="#2c3e66"/>
      <text x="91"  y="344" text-anchor="middle" fill="#9fbfff">YOLO</text>
      <rect x="128" y="326" width="62" height="26" rx="6" fill="#16203a" stroke="#2c3e66"/>
      <text x="159" y="344" text-anchor="middle" fill="#9fbfff">COCO</text>
      <rect x="198" y="326" width="98" height="26" rx="6" fill="#16203a" stroke="#2c3e66"/>
      <text x="247" y="344" text-anchor="middle" fill="#9fbfff">Pascal VOC</text>
      <rect x="304" y="326" width="50" height="26" rx="6" fill="#16203a" stroke="#2c3e66"/>
      <text x="329" y="344" text-anchor="middle" fill="#9fbfff">CSV</text>
      <rect x="362" y="326" width="54" height="26" rx="6" fill="#241c3a" stroke="#4b3a7a"/>
      <text x="389" y="344" text-anchor="middle" fill="#c9b6ff">SAM</text>
      <rect x="424" y="326" width="58" height="26" rx="6" fill="#132a22" stroke="#25563f"/>
      <text x="453" y="344" text-anchor="middle" fill="#7fe3aa">OBB</text>
    </g>
  </g>

  <!-- Right: editor window -->
  <rect x="620" y="36" width="540" height="348" rx="14" fill="#13161c" stroke="#272c35"/>
  <circle cx="642" cy="58" r="5" fill="#f5414f"/>
  <circle cx="660" cy="58" r="5" fill="#f5a524"/>
  <circle cx="678" cy="58" r="5" fill="#37d67a"/>
  <text x="890" y="62" text-anchor="middle" class="mono" font-size="12" fill="#7a8290">annotate / street_0042.jpg</text>

  <g clip-path="url(#canvasClip)">
    <!-- Scene -->
    <rect x="640" y="80" width="500" height="250" fill="url(#sky)"/>
    <circle cx="1084" cy="122" r="18" fill="#f5a524" opacity=".75"/>
    <path d="M640 270 Q760 228 880 262 T1140 250 V330 H640 Z" fill="#192739"/>
    <rect x="640" y="290" width="500" height="40" fill="#20252e"/>
    <path d="M640 312 H1140" stroke="#3a4150" stroke-width="3" stroke-dasharray="18 14"/>

    <rect x="701" y="236" width="10" height="56" fill="#5a3d2b"/>
    <circle cx="706" cy="214" r="26" fill="#2f7d55"/>
    <circle cx="688" cy="230" r="17" fill="#2a6f4c"/>
    <circle cx="724" cy="228" r="18" fill="#2a6f4c"/>

    <rect x="800" y="262" width="160" height="34" rx="10" fill="#6b7a99"/>
    <path d="M830 262 L850 238 H915 L938 262 Z" fill="#56637f"/>
    <path d="M856 258 L867 243 H889 V258 Z M896 258 V243 H912 L925 258 Z" fill="#a9c7ff" opacity=".55"/>
    <circle cx="836" cy="298" r="13" fill="#0d0f13" stroke="#565e6c" stroke-width="4"/>
    <circle cx="924" cy="298" r="13" fill="#0d0f13" stroke="#565e6c" stroke-width="4"/>

    <circle cx="1041" cy="226" r="11" fill="#e9c39b"/>
    <rect x="1030" y="239" width="22" height="36" rx="8" fill="#c8434f"/>
    <rect x="1032" y="272" width="8" height="24" rx="3" fill="#2a303b"/>
    <rect x="1042" y="272" width="8" height="24" rx="3" fill="#2a303b"/>

    <!-- AI scan -->
    <rect class="scan" x="640" y="80" width="500" height="40" fill="url(#scan)"/>

    <!-- Annotations -->
    <g class="overlay sans">
      <path class="draw dC" pathLength="100" stroke="#37d67a" d="M674 224 L684 196 L706 184 L730 194 L746 220 L738 242 L713 248 L713 292 L699 292 L699 248 L676 242 Z"/>
      <path class="tC" fill="#37d67a" fill-opacity=".16" d="M674 224 L684 196 L706 184 L730 194 L746 220 L738 242 L713 248 L713 292 L699 292 L699 248 L676 242 Z"/>
      <g class="tC">
        <rect x="674" y="164" width="110" height="18" rx="3" fill="#37d67a"/>
        <text x="680" y="177" font-size="12" font-weight="700" fill="#0d0f13">tree · polygon</text>
      </g>

      <path class="draw dA" pathLength="100" stroke="#5fd0e8" d="M792 230 H968 V314 H792 Z"/>
      <g class="tA">
        <rect x="792" y="211" width="78" height="18" rx="3" fill="#5fd0e8"/>
        <text x="798" y="224" font-size="12" font-weight="700" fill="#0d0f13">car 0.94</text>
        <g fill="#0d0f13" stroke="#5fd0e8" stroke-width="1.5">
          <rect x="788" y="226" width="8" height="8"/><rect x="964" y="226" width="8" height="8"/>
          <rect x="788" y="310" width="8" height="8"/><rect x="964" y="310" width="8" height="8"/>
        </g>
      </g>

      <path class="draw dB" pathLength="100" stroke="#f5a524" d="M1020 208 H1062 V300 H1020 Z"/>
      <g class="tB">
        <rect x="1020" y="189" width="96" height="18" rx="3" fill="#f5a524"/>
        <text x="1026" y="202" font-size="12" font-weight="700" fill="#0d0f13">person 0.91</text>
      </g>
    </g>
  </g>

  <!-- Status bar -->
  <g class="mono" font-size="12">
    <circle cx="646" cy="357" r="4" fill="#37d67a" class="pulse"/>
    <text x="658" y="361" fill="#7a8290">auto-annotate · yolo11n.pt · conf 0.25</text>
    <text x="1140" y="361" text-anchor="end" fill="#37d67a" class="done">3 objects · saved ✓</text>
  </g>
</svg>
